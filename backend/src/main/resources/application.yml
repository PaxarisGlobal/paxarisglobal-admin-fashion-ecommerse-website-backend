server:
  port: 8080

spring:
  application:
    name: fashion-ecommerce-website
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false

# Applies to all profiles (postgres in Docker, local for dev)
stylehub:
  paxaris:
    enabled: ${PAXARIS_ENABLED:true}
    gateway-url: ${PAXARIS_GATEWAY_URL:http://127.0.0.1:8085}
    realm: ${PAXARIS_REALM:paxarisglobal}
    product-id: ${PAXARIS_PRODUCT_ID:yatrify}
    default-user-role: ${PAXARIS_DEFAULT_USER_ROLE:user}

logging:
  level:
    root: INFO
    org.springframework.web: INFO

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:appdb}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      indent_output: true
  flyway:
    enabled: true
    baseline-on-migrate: true

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      indent_output: true
  flyway:
    enabled: false
